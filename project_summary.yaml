board:
  name: Waveshare ESP32-S3 Touch AMOLED 2.41
  mcu: ESP32-S3
  flash: 16MB
  psram: 8MB
  display_controller: SH8601
  display_interface: QSPI
  display_resolution: 600x450
  circuitpython_version: 9.2.8

pins:
  display_qspi:
    cs: GPIO9
    sck: GPIO10
    d0: GPIO11
    d1: GPIO12
    d2: GPIO13
    d3: GPIO14
    reset: GPIO21
  power:
    display_power: GPIO16 # Critical for display operation
    battery_control: GPIO16
    battery_key: GPIO15
  i2c:
    sda: GPIO47
    scl: GPIO48
  spi_sd:
    cs: GPIO2
    sck: GPIO4
    mosi: GPIO5
    miso: GPIO6
  touch:
    sda: GPIO47 # Shared with I2C
    scl: GPIO48 # Shared with I2C
    reset: GPIO3
    interrupt: EXIO2
  other:
    battery_adc: GPIO17
    uart_tx: GPIO43
    uart_rx: GPIO44
    boot_button: GPIO0

i2c_devices:
  - { name: Touch FT6336U, addr: 0x38, status: working }
  - { name: RTC PCF85063, addr: 0x51, status: working }
  - { name: IMU QMI8658C, addr: 0x6B, status: working }
  - { name: IO Expander PCA9554, addr: 0x20, status: working }

major_roadblock:
  problem: Display driver not integrated with CircuitPython's `displayio`.
  symptom: Screen remains black even after PSRAM and power are correctly configured.
  cause: The native C-level display initialization in `board.c` does not create and register a `displayio.Display` object.
  solution: Refactor `board.c` to perform a full `displayio` integration, making the screen available as `board.DISPLAY`.

issues_solved:
  - { name: PSRAM not enabled, id: psram_config }
  - { name: Display power pin not enabled, id: power_pin }
  - { name: Incorrect display controller, id: wrong_controller }
  - { name: REPL hang on boot, id: repl_hang }
  - { name: Incorrect initialization sequence, id: init_sequence }
  - { name: Display column offset, id: display_offset }
  - { name: CS pin conflicts, id: pin_conflicts }
  - {
      name: I2C internal pull-ups missing,
      id: i2c_pullups,
      solution: Manual configuration before I2C init,
    }
  - {
      name: RTC stuck in TEST mode,
      id: rtc_test_mode,
      solution: Clear TEST1 bit in Control_1 register,
    }
  - {
      name: IMU gyroscope saturation,
      id: imu_gyro_saturation,
      solution: Added on-demand calibration command (0xA2 to CTRL9) during init,
    }

working_features:
  - REPL access
  - 8MB PSRAM (verified via `gc.mem_free()`)
  - All I2C devices detected and communicating
  - Battery ADC reading
  - Display power control (GPIO16)
  - Onboard peripherals (Button)
  - SD Card slot (SPI mode)
  - RTC (PCF85063) - time keeping working
  - Touch controller (FT6336U) - multi-touch support (2 points)
  - IO Expander (PCA9554) - detected
  - IMU (QMI8658C) - accelerometer and gyroscope fully working
  - WiFi scanning
  - BLE scanning (active and passive)

limitations:
  - No DisplayIO integration (screen is black)
  - No touch driver library installed by default
  - I2C requires manual pull-up configuration (no external pull-ups on board)

test_suite_features:
  - Comprehensive hardware test for all onboard components
  - I2C device scanning with automatic detection
  - RTC oscillator control and time setting
  - IMU with proper initialization and on-demand calibration
  - Multi-touch detection and coordinate reporting
  - Battery voltage monitoring
  - SD card detection and info display
  - Active BLE scanning for device name retrieval

required_libraries:
  - pcf85063a (RTC)
  - adafruit_focaltouch (Touch controller)
  - struct (Built-in for IMU data conversion)

key_files:
  board_definition: ports/espressif/boards/waveshare_esp32s3_amoled_241/
  pins_config: ports/espressif/boards/waveshare_esp32s3_amoled_241/pins.c
  board_test_suite: test_scripts/board_test_suite.py
  i2c_helper: test_scripts/waveshare_i2c.py
  arduino_reference: ARDUINO/ESP32-S3-Touch-AMOLED-2.41-Demo/Arduino/examples/
  espidf_reference: ARDUINO/ESP32-S3-Touch-AMOLED-2.41-Demo/ESP-IDF/

notes:
  - GPIO47/48 are shared for all I2C devices (Touch, RTC, IMU, IO Expander)
  - USB Serial/JTAG disabled in sdkconfig to free I2C pins
  - Display uses QSPI interface, not SPI or parallel
  - IMU requires specific reset (0xB0) and calibration sequence from Arduino code
  - RTC Control_1 register must have TEST1 bit cleared for normal operation
